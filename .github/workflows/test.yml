name: Rigora checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Security checks
        run: python -m bandit -c pyproject.toml -r rigora
      - name: Test
        run: python -m pytest tests/ -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify independent installed wheel
        run: python scripts/verify_wheel.py dist --readonly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rigora-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  imervue-consumer:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: rigora-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jeffrey-Tool-Projects/Imervue
          ref: 14a80a7ad136bdf6370a272450ebd60bdf1487c7
          path: imervue-source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install Rigora and its consumer
        run: |
          python -m pip install ./rigora-source[gui] ./imervue-source
          python -m pip install -r imervue-source/dev_requirements.txt
          python -m pip install "pytest>=9"
      - name: Verify installed consumer contract
        working-directory: imervue-source
        run: python -m pytest tests/test_rigora_integration.py tests/test_rigora_service_status.py tests/test_background_jobs.py tests/test_optional_tabs.py -q
